version: '3.8'

services:
  eureka-server:
    build:
      context: ./backend/vayro-backend/eureka-server
    container_name: vayro-eureka-server
    restart: always
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      SERVER_PORT: 8761

  api-gateway:
    build:
      context: ./backend/vayro-backend/api-gateway
    container_name: vayro-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: https://vayro.com,http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:}
    depends_on:
      - eureka-server

  user-service:
    build:
      context: ./backend/vayro-backend/user-service
    container_name: vayro-user-service
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: ${DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}
      DB_PORT: ${DB_PORT:5432}
      DB_NAME: ${DB_NAME:postgres}
      DB_USERNAME: ${DB_USERNAME:postgres.lgpuulmsdogxzsyoqwdk}
      DB_PASSWORD: ${DB_PASSWORD:}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:718836314167-kekvffi6ugr8s6gfg6ds00qb190ee12s.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:}
    depends_on:
      - eureka-server

  vehicle-service:
    build:
      context: ./backend/vayro-backend/vehicle-service
    container_name: vayro-vehicle-service
    restart: always
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: ${DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}
      DB_PORT: ${DB_PORT:5432}
      DB_NAME: ${DB_NAME:postgres}
      DB_USERNAME: ${DB_USERNAME:postgres.lgpuulmsdogxzsyoqwdk}
      DB_PASSWORD: ${DB_PASSWORD:}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:}
    depends_on:
      - eureka-server

  booking-service:
    build:
      context: ./backend/vayro-backend/booking-service
    container_name: vayro-booking-service
    restart: always
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: ${DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}
      DB_PORT: ${DB_PORT:5432}
      DB_NAME: ${DB_NAME:postgres}
      DB_USERNAME: ${DB_USERNAME:postgres.lgpuulmsdogxzsyoqwdk}
      DB_PASSWORD: ${DB_PASSWORD:}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:}
    depends_on:
      - eureka-server

  notification-service:
    build:
      context: ./backend/vayro-backend
      dockerfile: notification-service/Dockerfile
    container_name: vayro-notification-service
    restart: always
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_HOST: ${DB_HOST:aws-0-ap-southeast-1.pooler.supabase.com}
      DB_PORT: ${DB_PORT:5432}
      DB_NAME: ${DB_NAME:postgres}
      DB_USERNAME: ${DB_USERNAME:postgres.lgpuulmsdogxzsyoqwdk}
      DB_PASSWORD: ${DB_PASSWORD:}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:}
      MAIL_HOST: ${MAIL_HOST:smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:587}
      MAIL_USERNAME: ${MAIL_USERNAME:vayro.notifications@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:true}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:true}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:VAYRO}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:vayro.notifications@gmail.com}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:admin@vayro.com}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:false}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:3}
      EMAIL_RETRY_DELAY_MS: ${EMAIL_RETRY_DELAY_MS:1000}
    depends_on:
      - eureka-server

  frontend:
    build:
      context: ./frontend
    container_name: vayro-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway
