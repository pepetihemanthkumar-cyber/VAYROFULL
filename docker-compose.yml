version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: vayro-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:VayroProdRootPass2026!}
      MYSQL_DATABASE: vayro_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  eureka-server:
    build:
      context: ./backend/vayro-backend/eureka-server
    container_name: vayro-eureka-server
    restart: always
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761

  api-gateway:
    build:
      context: ./backend/vayro-backend/api-gateway
    container_name: vayro-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: https://vayro.com,http://localhost:5173
    depends_on:
      - eureka-server

  user-service:
    build:
      context: ./backend/vayro-backend/user-service
    container_name: vayro-user-service
    restart: always
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: vayro_users
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:VayroProdRootPass2026!}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      - eureka-server
      - mysql-db

  vehicle-service:
    build:
      context: ./backend/vayro-backend/vehicle-service
    container_name: vayro-vehicle-service
    restart: always
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: vayro_vehicles
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:VayroProdRootPass2026!}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      - eureka-server
      - mysql-db

  booking-service:
    build:
      context: ./backend/vayro-backend/booking-service
    container_name: vayro-booking-service
    restart: always
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: vayro_bookings
      DB_USERNAME: root
      DB_PASSWORD: ${DB_PASSWORD:VayroProdRootPass2026!}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    depends_on:
      - eureka-server
      - mysql-db

  frontend:
    build:
      context: .
    container_name: vayro-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
