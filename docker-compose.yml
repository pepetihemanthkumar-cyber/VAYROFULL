version: '3.8'

services:
  mysql-db:
    image: mysql:8.0
    container_name: vayro-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:${DB_PASSWORD:}}
      MYSQL_USER: ${DB_USERNAME:vayro_app}
      MYSQL_PASSWORD: ${DB_PASSWORD:}
      MYSQL_DATABASE: vayro_db
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  eureka-server:
    build:
      context: ./backend/vayro-backend/eureka-server
    container_name: vayro-eureka-server
    restart: always
    ports:
      - "127.0.0.1:8761:8761"
    environment:
      SERVER_PORT: 8761

  api-gateway:
    build:
      context: ./backend/vayro-backend/api-gateway
    container_name: vayro-api-gateway
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      CORS_ALLOWED_ORIGINS: https://vayro.com,http://localhost:5173
      JWT_SECRET: ${JWT_SECRET:}
    depends_on:
      - eureka-server

  user-service:
    build:
      context: ./backend/vayro-backend/user-service
    container_name: vayro-user-service
    restart: always
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      SERVER_PORT: 8081
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: vayro_users
      DB_USERNAME: ${DB_USERNAME:vayro_app}
      DB_PASSWORD: ${DB_PASSWORD:}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:718836314167-kekvffi6ugr8s6gfg6ds00qb190ee12s.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:}
    depends_on:
      - eureka-server
      - mysql-db

  vehicle-service:
    build:
      context: ./backend/vayro-backend/vehicle-service
    container_name: vayro-vehicle-service
    restart: always
    ports:
      - "127.0.0.1:8082:8082"
    environment:
      SERVER_PORT: 8082
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: vayro_vehicles
      DB_USERNAME: ${DB_USERNAME:vayro_app}
      DB_PASSWORD: ${DB_PASSWORD:}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:}
    depends_on:
      - eureka-server
      - mysql-db

  booking-service:
    build:
      context: ./backend/vayro-backend/booking-service
    container_name: vayro-booking-service
    restart: always
    ports:
      - "127.0.0.1:8083:8083"
    environment:
      SERVER_PORT: 8083
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: vayro_bookings
      DB_USERNAME: ${DB_USERNAME:vayro_app}
      DB_PASSWORD: ${DB_PASSWORD:}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:}
    depends_on:
      - eureka-server
      - mysql-db

  notification-service:
    build:
      context: ./backend/vayro-backend/notification-service
    container_name: vayro-notification-service
    restart: always
    ports:
      - "127.0.0.1:8084:8084"
    environment:
      SERVER_PORT: 8084
      DB_HOST: mysql-db
      DB_PORT: 3306
      DB_NAME: vayro_notifications
      DB_USERNAME: ${DB_USERNAME:vayro_app}
      DB_PASSWORD: ${DB_PASSWORD:}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:}
      MAIL_HOST: ${MAIL_HOST:smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:465}
      MAIL_USERNAME: ${MAIL_USERNAME:vayro.notifications@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:true}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:true}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:VAYRO}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:vayro.notifications@gmail.com}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:admin@vayro.com}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:false}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:3}
      EMAIL_RETRY_DELAY_MS: ${EMAIL_RETRY_DELAY_MS:1000}
    depends_on:
      - eureka-server
      - mysql-db

  frontend:
    build:
      context: ./frontend
    container_name: vayro-frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - api-gateway

volumes:
  mysql_data:
