name: VAYRO CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  authenticate:
    name: Authenticate with Google Cloud
    runs-on: ubuntu-latest

    steps:
      # Step 1: Download the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2: Authenticate using Workload Identity Federation
      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}

      # Step 3: Install Google Cloud CLI
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      # Step 4: Verify authentication
      - name: Verify Google Cloud project
        run: |
          echo "Checking Google Cloud configuration..."
          gcloud config set project "${{ vars.GCP_PROJECT_ID }}"
          gcloud config get-value project
          echo "Google Cloud authentication succeeded."

      # Step 5: Build the frontend
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build VAYRO frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      # Step 6: Set up Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/vayro-backend/pom.xml

      # Step 7: Build the backend
      - name: Build VAYRO backend
        working-directory: backend/vayro-backend
        run: mvn clean package -DskipTests -B

      # Step 8: Report success
      - name: Finish
        run: |
          echo "VAYRO frontend build completed."
          echo "VAYRO backend build completed."
          echo "Workload Identity Federation authentication completed."
