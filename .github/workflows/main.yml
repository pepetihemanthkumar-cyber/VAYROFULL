name: VAYRO CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    name: Authenticate with Google Cloud
    runs-on: ubuntu-latest

    steps:
      - name: Checkout VAYRO repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud using WIF
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: vayro-deployer@vayro-deployment-511213.iam.gserviceaccount.com

      - name: Verify Google Cloud authentication
        run: |
          echo "VAYRO GitHub Actions authentication succeeded."
