name: VAYRO CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: vayro-deployment
  cancel-in-progress: false

env:
  PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
  REGION: asia-southeast1
  REPOSITORY: vayro-docker-repo

jobs:
  deploy:
    name: Build and Deploy VAYRO
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate configuration
        env:
          WIF_PROVIDER: ${{ vars.GCP_WIF_PROVIDER }}
          DEPLOYER_ACCOUNT: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
        run: |
          set -euo pipefail

          test -n "$WIF_PROVIDER" || {
            echo "::error::GCP_WIF_PROVIDER is missing"
            exit 1
          }

          test -n "$DEPLOYER_ACCOUNT" || {
            echo "::error::GCP_WIF_SERVICE_ACCOUNT is missing"
            exit 1
          }

          test -n "$PROJECT_ID" || {
            echo "::error::GCP_PROJECT_ID is missing"
            exit 1
          }

          echo "Configuration validated."

      - name: Authenticate with Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_WIF_SERVICE_ACCOUNT }}
          project_id: ${{ vars.GCP_PROJECT_ID }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify project
        run: |
          set -euo pipefail
          gcloud config set project "$PROJECT_ID"
          gcloud projects describe "$PROJECT_ID" \
            --format="value(projectId)"

      - name: Configure Docker authentication
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" --quiet

      - name: Build and push backend image
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/vayro-backend"

          docker build \
            -t "${IMAGE}:${GITHUB_SHA}" \
            backend/vayro-backend

          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy backend to Cloud Run
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/vayro-backend:${GITHUB_SHA}"

          gcloud run deploy vayro-backend \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --memory 2Gi \
            --cpu 2 \
            --min 0 \
            --max 3 \
            --timeout 300 \
            --allow-unauthenticated \
            --set-secrets "DB_PASSWORD=DB_PASSWORD:latest,JWT_SECRET=JWT_SECRET:latest" \
            --quiet

      - name: Get backend URL
        id: backend
        run: |
          set -euo pipefail

          URL="$(gcloud run services describe vayro-backend \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.url)')"

          test -n "$URL"
          echo "url=$URL" >> "$GITHUB_OUTPUT"
          echo "Backend URL: $URL"

      - name: Build and push frontend image
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/vayro-frontend"

          docker build \
            --build-arg VITE_API_URL="${{ steps.backend.outputs.url }}" \
            -t "${IMAGE}:${GITHUB_SHA}" \
            frontend

          docker push "${IMAGE}:${GITHUB_SHA}"

      - name: Deploy frontend to Cloud Run
        run: |
          set -euo pipefail

          IMAGE="${REGION}-docker.pkg.dev/${PROJECT_ID}/${REPOSITORY}/vayro-frontend:${GITHUB_SHA}"

          gcloud run deploy vayro-frontend \
            --image "$IMAGE" \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --platform managed \
            --memory 512Mi \
            --cpu 1 \
            --min 0 \
            --max 3 \
            --allow-unauthenticated \
            --quiet

      - name: Verify deployment
        id: verify
        run: |
          set -euo pipefail

          FRONTEND_URL="$(gcloud run services describe vayro-frontend \
            --region "$REGION" \
            --project "$PROJECT_ID" \
            --format='value(status.url)')"

          BACKEND_URL="${{ steps.backend.outputs.url }}"

          echo "Checking frontend..."
          curl --fail --silent --show-error \
            --max-time 30 "${FRONTEND_URL}/healthz"

          echo
          echo "Checking backend health endpoint..."
          if ! curl --fail --silent --show-error \
            --max-time 30 "${BACKEND_URL}/actuator/health"; then
            echo "::warning::Backend health endpoint did not return success. Check Cloud Run logs."
          fi

          echo "Frontend URL: $FRONTEND_URL"
          echo "Backend URL: $BACKEND_URL"

          echo "frontend_url=$FRONTEND_URL" >> "$GITHUB_OUTPUT"
          echo "backend_url=$BACKEND_URL" >> "$GITHUB_OUTPUT"

      - name: Deployment summary
        env:
          FRONTEND_URL: ${{ steps.verify.outputs.frontend_url }}
          BACKEND_URL: ${{ steps.verify.outputs.backend_url }}
        run: |
          echo "======================================"
          echo "VAYRO CLOUD RUN DEPLOYMENT"
          echo "======================================"
          echo "Frontend: $FRONTEND_URL"
          echo "Backend:  $BACKEND_URL"
          echo "======================================"
