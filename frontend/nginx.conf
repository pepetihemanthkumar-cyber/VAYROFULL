# Rate limiting zone for authentication endpoints (shared 10MB memory zone, 15 requests/minute per client IP)
limit_req_zone $binary_remote_addr zone=vayro_auth_limit:10m rate=15r/m;

server {
    listen 8080;
    server_name localhost;

    # Root directory for static assets
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Standard security headers (HSTS deliberately omitted until production HTTPS is active)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate-limited reverse proxy for authentication endpoints
    location /api/auth/ {
        limit_req zone=vayro_auth_limit burst=10 nodelay;
        limit_req_status 429;

        proxy_pass http://api-gateway:8080/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Trusted Edge Proxy: Overwrite client-supplied headers with the verified peer address
        # (If an upstream CDN/ALB is added later, enable Nginx real_ip_module with set_real_ip_from)
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Reverse proxy API Gateway traffic for general API routes
    location /api/ {
        proxy_pass http://api-gateway:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;

        # Trusted Edge Proxy: Overwrite client-supplied headers with the verified peer address
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Handle React client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets efficiently
    location ~* \.(?:ico|css|js|gif|jpe?g|png|webp|woff2?|eot|ttf|svg)$ {
        expires 6M;
        access_log off;
        add_header Cache-Control "public, max-age=15552000, immutable";
        try_files $uri =404;
    }

    # Health check endpoint for Cloud Run
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'OK';
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
