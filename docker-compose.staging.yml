# ==============================================================================
# VAYRO — Isolated Staging Docker Compose Configuration
# Usage:
#   docker compose -p vayro-staging -f docker-compose.staging.yml up -d
#
# HARDENED DATABASE ISOLATION:
# - FAILS CLOSED: Requires explicit STAGING_DB_* environment variables.
# - ZERO FALLBACK: Never silently falls back to SUPABASE_DB_* or production DB.
# - OVERWRITES SPRING_DATASOURCE_URL: Prevents ambient production connection strings.
# - PORT & NAME ISOLATION: Runs on non-conflicting staging ports (8088, 8090-8094, 8762).
# ==============================================================================

services:
  eureka-server:
    build:
      context: ./backend/vayro-backend/eureka-server
    container_name: vayro-staging-eureka-server
    restart: always
    ports:
      - "127.0.0.1:8762:8761"
    environment:
      SERVER_PORT: 8761

  api-gateway:
    build:
      context: ./backend/vayro-backend/api-gateway
    container_name: vayro-staging-api-gateway
    restart: always
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://vayro.com,https://www.vayro.com,http://localhost:5173,http://localhost,http://localhost:8088}
      JWT_SECRET: ${JWT_SECRET:-}
      USER_SERVICE_URL: http://user-service:8081
      VEHICLE_SERVICE_URL: http://vehicle-service:8082
      BOOKING_SERVICE_URL: http://booking-service:8083
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
    depends_on:
      - eureka-server

  user-service:
    build:
      context: ./backend/vayro-backend/user-service
    container_name: vayro-staging-user-service
    restart: always
    ports:
      - "127.0.0.1:8091:8081"
    environment:
      SERVER_PORT: 8081
      # Explicit Staging Database Configuration (Fail-Closed: Zero fallback to production)
      DB_HOST: ${STAGING_DB_HOST:?STAGING_DB_HOST is required for isolated staging database connection}
      DB_PORT: ${STAGING_DB_PORT:?STAGING_DB_PORT is required (e.g. 5432)}
      DB_NAME: ${STAGING_DB_NAME:?STAGING_DB_NAME is required for isolated staging database connection}
      DB_USERNAME: ${STAGING_DB_USERNAME:?STAGING_DB_USERNAME is required for isolated staging database connection}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD is required for isolated staging database connection}
      DB_SSLMODE: ${STAGING_DB_SSLMODE:?STAGING_DB_SSLMODE is required (e.g. ?sslmode=require)}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${STAGING_DB_HOST:?STAGING_DB_HOST is required}:${STAGING_DB_PORT:?STAGING_DB_PORT is required}/${STAGING_DB_NAME:?STAGING_DB_NAME is required}${STAGING_DB_SSLMODE:?STAGING_DB_SSLMODE is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-718836314167-kekvffi6ugr8s6gfg6ds00qb190ee12s.apps.googleusercontent.com}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      ADMIN_BOOTSTRAP_ENABLED: ${STAGING_ADMIN_BOOTSTRAP_ENABLED:-true}
      ADMIN_EMAIL: ${STAGING_ADMIN_EMAIL:-staging-admin@vayro.com}
      ADMIN_PASSWORD: ${STAGING_ADMIN_PASSWORD:?STAGING_ADMIN_PASSWORD is required for staging admin account}
    depends_on:
      - eureka-server

  vehicle-service:
    build:
      context: ./backend/vayro-backend/vehicle-service
    container_name: vayro-staging-vehicle-service
    restart: always
    ports:
      - "127.0.0.1:8092:8082"
    environment:
      SERVER_PORT: 8082
      # Explicit Staging Database Configuration (Fail-Closed: Zero fallback to production)
      DB_HOST: ${STAGING_DB_HOST:?STAGING_DB_HOST is required for isolated staging database connection}
      DB_PORT: ${STAGING_DB_PORT:?STAGING_DB_PORT is required (e.g. 5432)}
      DB_NAME: ${STAGING_DB_NAME:?STAGING_DB_NAME is required for isolated staging database connection}
      DB_USERNAME: ${STAGING_DB_USERNAME:?STAGING_DB_USERNAME is required for isolated staging database connection}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD is required for isolated staging database connection}
      DB_SSLMODE: ${STAGING_DB_SSLMODE:?STAGING_DB_SSLMODE is required (e.g. ?sslmode=require)}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${STAGING_DB_HOST:?STAGING_DB_HOST is required}:${STAGING_DB_PORT:?STAGING_DB_PORT is required}/${STAGING_DB_NAME:?STAGING_DB_NAME is required}${STAGING_DB_SSLMODE:?STAGING_DB_SSLMODE is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      - eureka-server

  booking-service:
    build:
      context: ./backend/vayro-backend/booking-service
    container_name: vayro-staging-booking-service
    restart: always
    ports:
      - "127.0.0.1:8093:8083"
    environment:
      SERVER_PORT: 8083
      # Explicit Staging Database Configuration (Fail-Closed: Zero fallback to production)
      DB_HOST: ${STAGING_DB_HOST:?STAGING_DB_HOST is required for isolated staging database connection}
      DB_PORT: ${STAGING_DB_PORT:?STAGING_DB_PORT is required (e.g. 5432)}
      DB_NAME: ${STAGING_DB_NAME:?STAGING_DB_NAME is required for isolated staging database connection}
      DB_USERNAME: ${STAGING_DB_USERNAME:?STAGING_DB_USERNAME is required for isolated staging database connection}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD is required for isolated staging database connection}
      DB_SSLMODE: ${STAGING_DB_SSLMODE:?STAGING_DB_SSLMODE is required (e.g. ?sslmode=require)}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${STAGING_DB_HOST:?STAGING_DB_HOST is required}:${STAGING_DB_PORT:?STAGING_DB_PORT is required}/${STAGING_DB_NAME:?STAGING_DB_NAME is required}${STAGING_DB_SSLMODE:?STAGING_DB_SSLMODE is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET:-}
      VEHICLE_SERVICE_URL: http://vehicle-service:8082
      NOTIFICATION_SERVICE_URL: http://notification-service:8084
      USER_SERVICE_URL: http://user-service:8081
    depends_on:
      - eureka-server

  notification-service:
    build:
      context: ./backend/vayro-backend
      dockerfile: notification-service/Dockerfile
    container_name: vayro-staging-notification-service
    restart: always
    ports:
      - "127.0.0.1:8094:8084"
    environment:
      SERVER_PORT: 8084
      # Explicit Staging Database Configuration (Fail-Closed: Zero fallback to production)
      DB_HOST: ${STAGING_DB_HOST:?STAGING_DB_HOST is required for isolated staging database connection}
      DB_PORT: ${STAGING_DB_PORT:?STAGING_DB_PORT is required (e.g. 5432)}
      DB_NAME: ${STAGING_DB_NAME:?STAGING_DB_NAME is required for isolated staging database connection}
      DB_USERNAME: ${STAGING_DB_USERNAME:?STAGING_DB_USERNAME is required for isolated staging database connection}
      DB_PASSWORD: ${STAGING_DB_PASSWORD:?STAGING_DB_PASSWORD is required for isolated staging database connection}
      DB_SSLMODE: ${STAGING_DB_SSLMODE:?STAGING_DB_SSLMODE is required (e.g. ?sslmode=require)}
      SPRING_DATASOURCE_URL: jdbc:postgresql://${STAGING_DB_HOST:?STAGING_DB_HOST is required}:${STAGING_DB_PORT:?STAGING_DB_PORT is required}/${STAGING_DB_NAME:?STAGING_DB_NAME is required}${STAGING_DB_SSLMODE:?STAGING_DB_SSLMODE is required}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      EUREKA_INSTANCE_PREFER_IP_ADDRESS: "true"
      JWT_SECRET: ${JWT_SECRET:-}
      USER_SERVICE_URL: http://user-service:8081
      MAIL_HOST: ${MAIL_HOST:-smtp.gmail.com}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-vayro.notifications@gmail.com}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_SMTP_AUTH: ${MAIL_SMTP_AUTH:-true}
      MAIL_SMTP_SSL_ENABLE: ${MAIL_SMTP_SSL_ENABLE:-false}
      MAIL_SMTP_STARTTLS_ENABLE: ${MAIL_SMTP_STARTTLS_ENABLE:-true}
      MAIL_FROM_NAME: ${MAIL_FROM_NAME:-VAYRO}
      MAIL_FROM_ADDRESS: ${MAIL_FROM_ADDRESS:-vayro.notifications@gmail.com}
      ADMIN_NOTIFICATION_EMAIL: ${ADMIN_NOTIFICATION_EMAIL:-admin@vayro.com}
      NOTIFICATION_EMAIL_ENABLED: ${NOTIFICATION_EMAIL_ENABLED:-false}
      EMAIL_MAX_RETRIES: ${EMAIL_MAX_RETRIES:-3}
      EMAIL_RETRY_DELAY_MS: ${EMAIL_RETRY_DELAY_MS:-1000}
    depends_on:
      - eureka-server

  frontend:
    build:
      context: ./frontend
    container_name: vayro-staging-frontend
    restart: always
    ports:
      - "8088:8080"
    depends_on:
      - api-gateway
