      DB_USERNAME: ${SUPABASE_DB_USERNAME:?SUPABASE_DB_USERNAME is required for Supabase connection}
      DB_PASSWORD: ${SUPABASE_DB_PASSWORD:?SUPABASE_DB_PASSWORD is required for Supabase connection}
      DB_SSLMODE: ${SUPABASE_DB_SSLMODE:-?sslmode=require}
      SPRING_JPA_HIBERNATE_DDL_AUTO: validate

  notification-service:
    environment:
      DB_HOST: ${SUPABASE_DB_HOST:?SUPABASE_DB_HOST is required for Supabase connection}
